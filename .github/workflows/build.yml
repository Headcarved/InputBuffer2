name: Build Geode Mod
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: windows-latest
    env:
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
      - uses: actions/upload-artifact@v4
        with:
          name: InputBuffer-geode
          path: ${{ steps.build.outputs.build-output }}
